<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA Ultimate</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins;color:#fff;background:linear-gradient(135deg,#0f0f0f,#1c1c2e,#0f0f0f);overflow-x:hidden}
.header{text-align:center;padding:25px;font-size:30px;letter-spacing:5px;color:#d4af37}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1100px;margin:auto;padding:30px}
.card{background:rgba(255,255,255,0.05);border-radius:15px;height:260px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;backdrop-filter:blur(10px);cursor:pointer;transition:.3s}
.card:hover{transform:translateY(-8px);box-shadow:0 10px 25px rgba(212,175,55,0.4)}
.card img{width:100%;height:150px;object-fit:cover}
.card h3{text-align:center;font-size:14px;margin:5px 0}
.card p{text-align:center;color:#d4af37}
.page{display:none;text-align:center;padding:30px}
button{background:#d4af37;border:none;padding:10px;border-radius:20px;margin:10px;cursor:pointer}
input,textarea{width:90%;padding:10px;margin:10px auto;display:block;border-radius:10px;border:none;background:#1a1a1a;color:#fff}
</style>
</head>
<body>

<div class="header">AURA STORE</div>

<!-- HOME -->
<div class="products" id="home">
  <div class="card" onclick="openProduct('Perfume')"><img src="images/1774885355807.jpeg"><h3>Perfume</h3><p>₹999</p></div>
  <div class="card" onclick="openProduct('Watch')"><img src="images/watch1.jpg"><h3>Watch</h3><p>₹1999</p></div>
  <div class="card" onclick="openProduct('Watch2')"><img src="images/watch2.jpg"><h3>Watch 2</h3><p>₹2499</p></div>
  <div class="card" onclick="openProduct('Perfume2')"><img src="images/perfume2.jpg"><h3>Perfume 2</h3><p>₹1199</p></div>
  <div class="card" onclick="openProduct('Perfume3')"><img src="images/perfume3.jpg"><h3>Perfume 3</h3><p>₹1399</p></div>
  <div class="card" onclick="openProduct('Watch3')"><img src="images/watch3.jpg"><h3>Watch 3</h3><p>₹2999</p></div>
</div>

<!-- PRODUCT PAGE -->
<div class="page" id="productPage">
  <button onclick="goHome()">← Back</button>
  <h2 id="pName"></h2>
  <img id="pImage" style="width:250px;border-radius:12px">
  <p id="pPrice"></p>
  <button onclick="showOrder()">Order Now</button>
</div>

<!-- ORDER PAGE -->
<div class="page" id="orderPage">
  <button onclick="goHome()">← Home</button>
  <h2>Order Details</h2>
  <form onsubmit="placeOrder(event)">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="tel" id="phone" placeholder="Phone Number" required>
    <textarea id="address" placeholder="Address" required></textarea>
    <input type="text" id="location" placeholder="Location">
    <input type="text" id="landmark" placeholder="Landmark">
    <button type="submit">Confirm Order</button>
  </form>
</div>

<script>
const products={
  Perfume:{name:"Perfume",price:999,img:"images/1774885355807.jpeg"},
  Watch:{name:"Watch",price:1999,img:"images/watch1.jpg"},
  Watch2:{name:"Watch 2",price:2499,img:"images/watch2.jpg"},
  Perfume2:{name:"Perfume 2",price:1199,img:"images/perfume2.jpg"},
  Perfume3:{name:"Perfume 3",price:1399,img:"images/perfume3.jpg"},
  Watch3:{name:"Watch 3",price:2999,img:"images/watch3.jpg"}
};

let currentProduct="";

function openProduct(name){
  currentProduct=name;
  document.getElementById('home').style.display='none';
  document.getElementById('productPage').style.display='block';
  const p=products[name];
  document.getElementById('pName').innerText=p.name;
  document.getElementById('pPrice').innerText='₹'+p.price;
  document.getElementById('pImage').src=p.img;
}

function goHome(){
  document.getElementById('home').style.display='grid';
  document.getElementById('productPage').style.display='none';
  document.getElementById('orderPage').style.display='none';
}

function showOrder(){
  document.getElementById('productPage').style.display='none';
  document.getElementById('orderPage').style.display='block';
}

function placeOrder(e){
  e.preventDefault();

  const name=document.getElementById('name').value;
  const phone=document.getElementById('phone').value;
  const address=document.getElementById('address').value;
  const location=document.getElementById('location').value;
  const landmark=document.getElementById('landmark').value;

  const message=`New Order%0AProduct: ${currentProduct}%0AName: ${name}%0APhone: ${phone}%0AAddress: ${address}%0ALocation: ${location}%0ALandmark: ${landmark}`;

  window.open(`https://wa.me/91YOURNUMBER?text=${message}`);

  alert('Order Sent Successfully');
}
</script>

</body>
</html>
